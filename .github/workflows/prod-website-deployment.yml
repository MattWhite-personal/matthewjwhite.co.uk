name: Production Website CI/CD Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "static-web-app/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "static-web-app/**"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: static-web-app/.nvmrc
          cache: npm
          cache-dependency-path: static-web-app/package-lock.json
      - name: Build
        working-directory: static-web-app
        run: |
          npm ci
          npm run build
      - name: Select Static Web App config
        env:
          CONFIG_SOURCE: ${{ github.event_name == 'pull_request' && 'staticwebapp.config.preview.json' || 'staticwebapp.config.json' }}
        run: |
          echo "Using ${CONFIG_SOURCE}"
          cp "static-web-app/${CONFIG_SOURCE}" static-web-app/dist/staticwebapp.config.json
      - name: Verify config matches environment
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        working-directory: static-web-app/dist
        run: |
          jq empty staticwebapp.config.json
          if [ "${IS_PR}" = "true" ]; then
            jq -e '(has("networking") or has("forwardingGateway")) | not' staticwebapp.config.json
          else
            jq -e 'has("networking") and has("forwardingGateway")' staticwebapp.config.json
          fi
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.PROD_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "./static-web-app/dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.PROD_SWA_TOKEN }}
          action: "close"
          app_location: "./static-web-app" # App source code path
